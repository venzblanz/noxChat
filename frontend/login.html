<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css" />
    <title>NOXCHAT</title>
</head>
<body>
    <div class="card">
        <div id="form-title">LOGIN</div>

    <div class="field">
        <label>Username</label>
        <input type="text" placeholder="noxiathegreat" autocomplete="off"/>
    </div>
    <div class="field">
        <label>Password</label>
        <input type="password" placeholder="*************" autocomplete="off"/>
    </div>
    <div class="field" id="confirm-field" style="display: none;">
        <label>Confirm Password</label>
        <input type="password" placeholder="*************" autocomplete="off"/>
    </div>
    <button class="btn-login" id="submit-btn">Login</button>
    <p class="signup-link" id="switch-text">Don't have an account yet? <a href="#" id="switch-btn">Sign-up</a></p>
    </div>
    <img class="char char-left"  src="images/knek.png" alt="" id="left-char"/>
    <img class="char char-right" src="images/noxia_sc_left.png" alt="" id="right-char"/>
    <script src="js/main.js"></script>
</body>
</html>
